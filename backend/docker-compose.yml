version: '3.8'

services:
  django: &django
    build: ./backend
    container_name: django
    command: ["./wait-for-it.sh", "postgre", "5432", "--", "python", "manage.py", "runserver", "0.0.0.0:8000"]
    volumes:
      - ./backend:/code
    ports:
      - 8000:8000
    depends_on:
      - postgre
    networks:
      - network1

  postgre:
    image: pgvector/pgvector:pg17
    container_name: postgresql
    env_file: ./backend/autoclean/.env
    volumes:
      - ./postgre/data:/var/lib/postgresql/data
    ports:
      - 5432:5432
    networks:
      - network1

  redis:
    image: redis:alpine
    container_name: redis_celery
    volumes:
      - ./redis/data:/data
    ports:
      - 6379:6379
    networks:
      - network1

  celery:
    <<: *django
    container_name: celery
    command: ["./wait-for-it.sh", "postgre", "5432", "--", "celery", "-A", "autoclean", "worker", "-B", "-l", "info"]
    ports: []

networks:
  network1:
